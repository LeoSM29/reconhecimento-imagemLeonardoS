<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gerencie suas tarefas diárias com organização e simplicidade.">
    <title>To-Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== LOGIN ==================== -->
    <div id="login-screen" class="auth-screen">
        <div class="glass-card auth-card">
            <div class="auth-card-header">
                <div class="auth-icon-wrap">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                </div>
                <h1 class="auth-title">Bem-vindo de volta</h1>
                <p class="auth-subtitle">Acesse sua conta para continuar</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <div class="form-field">
                        <label for="login-email">E-mail</label>
                        <input type="email" id="login-email" class="glass-input"
                            placeholder="seu@email.com" autocomplete="email">
                        <span id="login-email-error" class="error-msg" role="alert"></span>
                    </div>
                    <div class="form-field">
                        <label for="login-password">Senha</label>
                        <input type="password" id="login-password" class="glass-input"
                            placeholder="••••••••" autocomplete="current-password">
                        <span id="login-password-error" class="error-msg" role="alert"></span>
                    </div>
                    <span id="login-global-error" class="error-msg center" role="alert"></span>
                    <button type="submit" id="login-submit-btn" class="btn-primary full-width">
                        Entrar na conta
                    </button>
                </div>
            </form>

            <p class="auth-footer">
                Não tem uma conta?
                <a href="#" id="go-to-register">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- ==================== CADASTRO ==================== -->
    <div id="register-screen" class="auth-screen hidden-screen">
        <div class="glass-card auth-card">
            <div class="auth-card-header">
                <div class="auth-icon-wrap">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h1 class="auth-title">Criar sua conta</h1>
                <p class="auth-subtitle">Comece a organizar suas tarefas hoje</p>
            </div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <div class="form-field">
                        <label for="register-name">Nome completo</label>
                        <input type="text" id="register-name" class="glass-input"
                            placeholder="Seu nome" autocomplete="name">
                        <span id="register-name-error" class="error-msg" role="alert"></span>
                    </div>
                    <div class="form-field">
                        <label for="register-email">E-mail</label>
                        <input type="email" id="register-email" class="glass-input"
                            placeholder="seu@email.com" autocomplete="email">
                        <span id="register-email-error" class="error-msg" role="alert"></span>
                    </div>
                    <div class="form-field">
                        <label for="register-password">Senha</label>
                        <input type="password" id="register-password" class="glass-input"
                            placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <span id="register-password-error" class="error-msg" role="alert"></span>
                    </div>
                    <span id="register-global-error" class="error-msg center" role="alert"></span>
                    <button type="submit" id="register-submit-btn" class="btn-primary full-width">
                        Criar conta
                    </button>
                </div>
            </form>

            <p class="auth-footer">
                Já tem uma conta?
                <a href="#" id="go-to-login">Fazer login</a>
            </p>
        </div>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div id="dashboard-screen" class="dashboard-screen hidden-screen">
        <div class="dashboard-container">

            <!-- Header -->
            <header class="glass-card dashboard-header">
                <div class="header-user">
                    <div class="user-avatar" id="user-avatar" aria-hidden="true">?</div>
                    <div>
                        <p class="user-greeting">Olá,</p>
                        <p class="user-name" id="user-display-name">Usuário</p>
                    </div>
                </div>
                <button id="logout-btn" class="btn-danger">Sair</button>
            </header>

            <!-- Formulario de nova tarefa -->
            <section class="glass-card todo-form-section" aria-labelledby="new-task-title">
                <h2 class="section-title" id="new-task-title">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Nova Tarefa
                </h2>

                <form id="todo-form" novalidate>
                    <div class="todo-form-grid">
                        <div class="form-field">
                            <label for="todo-title" class="form-field-label">
                                Título <span class="required-star" aria-label="obrigatório">*</span>
                            </label>
                            <input type="text" id="todo-title" class="glass-input"
                                placeholder="Ex: Revisar relatório">
                            <span id="todo-title-error" class="error-msg" role="alert"></span>
                        </div>
                        <div class="form-field">
                            <label for="todo-type" class="form-field-label">Tipo</label>
                            <select id="todo-type" class="glass-input">
                                <option value="work">Trabalho</option>
                                <option value="personal">Pessoal</option>
                                <option value="study">Estudos</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-field" style="margin-bottom: 16px;">
                        <label for="todo-description" class="form-field-label">
                            Descrição <span class="optional-label">(opcional)</span>
                        </label>
                        <textarea id="todo-description" rows="2" class="glass-input"
                            placeholder="Detalhes adicionais sobre a tarefa..."></textarea>
                    </div>

                    <div class="todo-form-actions">
                        <button type="submit" id="todo-submit-btn" class="btn-primary">
                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                            </svg>
                            Adicionar Tarefa
                        </button>
                    </div>
                </form>
            </section>

            <!-- Lista de tarefas -->
            <section aria-labelledby="task-list-title">
                <div class="todo-list-header">
                    <h2 class="section-title" id="task-list-title" style="margin-bottom: 0;">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                        </svg>
                        Minhas Tarefas
                    </h2>
                    <span id="task-counter" class="task-counter" aria-live="polite"></span>
                </div>
                <div id="todo-list" class="todo-list" role="list"></div>
            </section>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
